<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Elimination Game</title>
<link rel="stylesheet" href="/assets/css/themes/widget-theme.css">
<style>
  :root{
    --ink-strong:#263238;
    --maroon:#8a3a3a; --maroon-bg:#f8efef;
    --line:#dde3e7;
    --t:#2e6cb5;   --t-bg:#eef4fb;   /* row being rewritten */
    --s:#4b7d3c;   --s-bg:#f2f8ef;   /* row being read from */
    --bad:#b7312c;
    --rowh:3.3rem;
  }
  html{scroll-behavior:smooth}
  /* clicks on rows, nodes and buttons shouldn't select text or show a caret */
  body{-webkit-user-select:none;user-select:none;cursor:default;caret-color:transparent}
  input{-webkit-user-select:text;user-select:text;caret-color:auto}
  button,.mrow:not(.static),[data-node]{cursor:pointer}
  body{font-size:17px;line-height:1.5}
  .h{font-family:var(--serif);font-weight:700;font-size:1.25rem;line-height:1.25;color:var(--ink-strong);margin:0}
  .w-plate{padding:22px 26px 20px}
  .screen{display:none}
  .screen.on{display:block}

  /* ---- shared bits ---- */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem}
  .top .w-label{display:block;margin-bottom:.15rem}
  .top h2{font-size:1.25rem;font-weight:500;color:var(--ink-strong);line-height:1.2}
  .top h2 span{color:var(--ink-mute);font-weight:400}
  .readout{display:flex;gap:1.6rem;font-family:var(--mono)}
  .readout .k{display:block;font-size:1.55rem;line-height:1.1;color:var(--ink-strong);font-variant-numeric:tabular-nums;text-align:right}
  .readout .w-label{display:block;text-align:right}
  button.primary{background:var(--accent);border-color:var(--accent-deep);color:var(--accent-on);padding:.5rem 1.4rem;font-size:.86rem;letter-spacing:.06em}
  button.primary:hover:not(:disabled){background:var(--accent-deep)!important;border-color:var(--accent-deep)!important;color:#fff}
  button.quiet{background:none;border-color:transparent;box-shadow:none;color:var(--ink-mute);padding:.3rem .6rem}
  button.quiet:hover:not(:disabled){background:none;border-color:var(--ink-faint);box-shadow:none;color:var(--ink)}
  button:disabled{color:var(--ink-faint);cursor:default;box-shadow:none;background:var(--btn-bg);border-color:var(--line)}
  button.sm{padding:.3rem .7rem;font-size:.9rem}
  button.warn{background:none;border-color:transparent;box-shadow:none;color:var(--maroon);padding:.3rem .6rem}
  button.warn:hover:not(:disabled){background:var(--maroon-bg)!important;border-color:var(--maroon)!important;box-shadow:none;color:var(--maroon)}

  /* ---- menu ---- */
  .menu{max-width:520px;margin:2.5rem auto 3rem;text-align:center}
  .menu .title{font-size:1.7rem;margin:.9rem 0 1.8rem;padding-bottom:.55rem;display:inline-block;
    border-bottom:3px solid;border-image:linear-gradient(90deg,var(--t),var(--s),var(--maroon)) 1}
  .emblem .mini{padding:.35rem .8rem}
  .emblem .mg{font-size:1.2rem;column-gap:1rem;color:var(--ink-faint)}
  .emblem .p1{color:var(--t);font-weight:700}
  .emblem .p2{color:var(--s);font-weight:700}
  .emblem .p3{color:var(--maroon);font-weight:700}
  .emblem .b{color:var(--ink-strong)}
  .menu .choices{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap}
  .menu .choices button{min-width:12rem;padding:.9rem 1.2rem;font-size:1.05rem;line-height:1.3}
  .menu .choices .sub{display:block;font-size:.85rem;opacity:.7;letter-spacing:0}

  /* ---- custom entry ---- */
  .entry{padding:.4rem 0 1.2rem;overflow-x:auto}
  .entry input{width:3.2rem;padding:.3rem .2rem;font:inherit;font-size:1.05rem;text-align:center;
    border:1px solid var(--line);border-radius:4px;background:var(--field-bg);color:var(--ink-strong)}
  .entry input:focus{outline:none;border-color:var(--accent)}
  .entry input::placeholder{color:var(--ink-faint)}
  .entry input.bad{border-color:var(--bad);background:#fff5f5}
  .entry .cell{padding:0 .3rem}
  .setup .note{color:var(--bad);font-size:.9rem;min-height:1.4rem;margin-bottom:.6rem}

  /* ---- setup ---- */
  .setup{max-width:620px;margin:0 auto;text-align:center}
  .setup .lede{color:var(--ink-mute);font-size:.98rem;margin:.3rem 0 1.4rem}
  .dials{display:flex;justify-content:center;gap:2.2rem;flex-wrap:wrap;margin-bottom:.4rem}
  .dial{display:flex;flex-direction:column;align-items:center;gap:.35rem}
  .dial .box{display:flex;align-items:center;gap:.15rem}
  .dial .box button{padding:.2rem .6rem;font-size:1rem;line-height:1;background:none;box-shadow:none;border-color:transparent;color:var(--ink-mute)}
  .dial .box button:hover:not(:disabled){border-color:var(--ink-faint);background:none;box-shadow:none;color:var(--ink)}
  .dial .box button:disabled{color:var(--line);background:none;border-color:transparent}
  .dial .v{font-family:var(--mono);font-size:1.5rem;min-width:2rem;text-align:center;color:var(--ink-strong);font-variant-numeric:tabular-nums}
  .par{font-family:var(--mono);font-size:.95rem;color:var(--ink-mute);margin:.6rem 0 1.4rem}
  .par b{font-weight:500;color:var(--ink-strong);font-size:1.05rem;letter-spacing:0}
  .setup .preview{padding:.4rem 0 1.4rem}
  .setup .actions{display:flex;justify-content:center;align-items:center;gap:1rem;flex-wrap:wrap}

  /* ---- play ---- */
  .cols{display:flex;gap:1.6rem;align-items:flex-start}
  .col-main{flex:1 1 0;min-width:0}
  .col-side{flex:0 0 250px;min-width:0;padding-left:1.4rem;border-left:1px solid var(--line)}
  .col-side .h{margin-bottom:.5rem}
  .board{padding:.9rem .4rem .6rem;overflow-x:auto}
  .modes{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.6rem}
  .modes button{flex:1 1 0;padding:.42rem .5rem;font-size:.8rem;line-height:1.35;min-width:7rem}
  .modes .fmla{display:block;font-size:.78rem;opacity:.75;font-family:var(--serif);letter-spacing:0}
  .prompt{font-size:.92rem;color:var(--ink-mute);min-height:1.5rem;margin-top:.7rem}
  .opline{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:.5rem;font-size:1.15rem;color:var(--ink-strong)}
  #cin{width:4.4rem;padding:.26rem .4rem;font:inherit;font-size:1.05rem;text-align:center;
       border:1px solid var(--ink-faint);border-radius:var(--radius);background:var(--field-bg);color:var(--ink-strong)}
  #cin:focus{outline:none;border-color:var(--accent)}
  #cin.bad{border-color:var(--bad)}
  .quick{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.5rem}
  .quick button{padding:.18rem .55rem;font-size:.74rem;box-shadow:none}
  .err{color:var(--bad);font-size:.85rem;margin-top:.45rem}

  ol.log{margin:0;padding-left:1.5rem;max-height:14rem;overflow-y:auto;font-size:1rem;color:var(--ink)}
  ol.log li{padding:.08rem 0}
  ol.log li::marker{font-family:var(--mono);font-size:.75rem;color:var(--ink-faint)}
  ol.log li.done{color:var(--ink-mute)}
  ol.log li.cur{color:var(--t);font-weight:600}
  .empty{color:var(--ink-faint);font-size:.92rem;font-style:italic}
  .side-actions{display:flex;flex-direction:column;gap:.4rem;margin-top:1.1rem}
  .side-actions .row{display:flex;gap:.4rem}
  .side-actions .row button{flex:1 1 0}
  .side-actions .primary{margin-top:.5rem}
  .result{padding:.7rem .9rem .8rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--field-bg)}
  .result .verdict{font-size:1.3rem;color:var(--ink-strong);font-weight:500;line-height:1.2}
  .result .score{font-size:.9rem;color:var(--ink-mute);margin-top:.15rem}
  .result .why{font-size:.95rem;color:var(--ink);margin-top:.4rem}
  .result .soln{margin-top:.6rem;padding-top:.6rem;border-top:1px solid var(--line);font-size:1.05rem;overflow-x:auto;color:var(--ink-strong)}
  .result .free{font-size:.92rem;color:var(--ink-mute);margin-top:.3rem}
  .result .jump{color:var(--accent);text-decoration:none;border-bottom:1px dotted currentColor}

  /* ---- solution section ---- */
  .soln-sec .h{margin-bottom:.6rem}
  .soln-tabs{display:flex;gap:.4rem;margin-bottom:.8rem}
  .soln-body{font-size:1.15rem;color:var(--ink-strong);overflow-x:auto;line-height:1.7}
  #partSol{display:flex;align-items:center;flex-wrap:wrap;gap:.2rem .8rem}
  .soln-body.eqs div{padding:.05rem 0}
  .tag-free{font-size:.8rem;color:var(--ink-mute);margin-left:.3rem;font-style:italic}
  .fv{font-weight:600}
  .soln-part{margin-top:1rem;padding-top:.9rem;border-top:1px dashed var(--line)}
  .soln-sub{font-size:.92rem;color:var(--ink-mute)}
  .tsliders{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.6rem 0 .5rem}
  .tslider{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;color:var(--ink-strong)}
  .tslider .tv{min-width:1.6rem;text-align:right;font-variant-numeric:tabular-nums}
  .tslider input[type=range]{width:9rem}

  .review .now{font-size:1.05rem;color:var(--ink-strong);margin-bottom:.6rem;min-height:1.6rem}
  .review .nav{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}

  .orig{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--line)}
  .orig .h{margin-bottom:.4rem}
  .col-side .h:empty{display:none}
  #log:empty + .side-actions{margin-top:0}

  /* ---- row-operations strip ---- */
  .steps{display:flex;align-items:center;gap:.7rem;overflow-x:auto;padding:.5rem .2rem .8rem}
  .step{flex:none}
  .mini{position:relative;display:inline-block;padding:.2rem .6rem;--caph:0;--labw:0}
  .mg{display:grid;column-gap:.7rem;row-gap:.15rem;justify-items:center;font-size:.98rem;color:var(--ink-strong)}
  .mg .aug{border-left:1px solid var(--ink-faint);padding-left:.55rem;justify-self:stretch;text-align:center}
  .mg .chg{color:var(--t)}
  /* bottom padding matches the label so the shaft sits at the matrices' midline */
  .arw{flex:none;display:flex;flex-direction:column;align-items:stretch;min-width:4.5rem;padding-bottom:1.35rem}
  .arw .lbl{font-size:.85rem;line-height:1.2rem;color:var(--ink-mute);white-space:nowrap;text-align:center;padding:0 .4rem .15rem}
  .arw .shaft{position:relative;height:0;border-top:1.5px solid var(--ink-mute);margin-right:.35rem}
  .arw .shaft::after{content:"";position:absolute;right:-.4rem;top:-.36rem;
    border-left:.55rem solid var(--ink-mute);border-top:.3rem solid transparent;border-bottom:.3rem solid transparent}
  .ph{visibility:hidden}

  /* ---- adventure ---- */
  :root{--hp:#b7312c;--hp-bg:#f6e3e2;--foe:#6a4c93;--foe-bg:#eee8f5;--gold:#b5801d;--xp:#1f7a8c}
  .diffs{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;margin:.4rem 0 1.4rem}
  .diffs button{min-width:9.5rem;padding:.75rem 1rem;font-size:1.02rem;line-height:1.3}
  .diffs .sub{display:block;font-size:.82rem;opacity:.7}
  .cont{margin-bottom:1.2rem}
  .cont button{padding:.7rem 1.4rem;font-size:1.02rem;line-height:1.3}
  .cont .sub{display:block;font-size:.82rem;opacity:.75}
  .advnote{color:var(--ink-mute);font-size:.9rem;margin-bottom:.4rem}

  .hud{display:flex;flex-direction:column;align-items:stretch;gap:.4rem;font-size:.95rem;color:var(--ink-strong)}
  .hudrow{display:flex;gap:1.4rem;align-items:flex-end;flex-wrap:wrap;justify-content:flex-end}
  .xprow{display:flex;align-items:center;gap:.6rem;font-size:.85rem;color:var(--ink-mute)}
  .xprow span:first-child{color:var(--ink-strong);font-weight:600}
  .xprow .xpbar{flex:1 1 auto;min-width:4rem;height:.45rem;background:var(--line);border-radius:3px;overflow:hidden}
  .xprow .xpbar i{display:block;height:100%;background:#5f7a3a}
  .mapwrap{position:relative}
  .sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(30rem,calc(100% - 2rem));
    padding:1rem 1.2rem 1.1rem;background:#f8f0dc;border:1px solid #b89a6a;border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(60,40,15,.28);text-align:center}
  .sheet .nm{font-size:1.2rem;font-weight:600;color:var(--ink-strong);margin-bottom:.3rem}
  .sheet .meta{font-size:.92rem;color:var(--ink-mute);margin:0 0 .8rem}
  .sheet .x{position:absolute;right:.4rem;top:.3rem;font-size:1.2rem;line-height:1}
  .sheet .dials{gap:1.6rem;margin-bottom:.9rem}
  .sheet .shop{text-align:left}
  .ware button{white-space:nowrap}
  .hud .it{display:flex;flex-direction:column;align-items:center;gap:.1rem}
  .hud .it .w-label,.hud .spr{height:1.45rem;display:flex;align-items:flex-end}
  .hud .spr{width:auto;object-fit:contain}
  .hud .it b{font-size:1.2rem;font-weight:600;line-height:1.1}
  .hud .gold{color:var(--gold)}
  /* the map is drawn on a parchment scroll. The image is 9-sliced
     (rollers top and bottom, torn edges at the sides) so it stretches to any width. */
  .map{--road:#5e4122;--road-hi:#94714a;--moss:#556b2f;--rust:#9c4a22;--ochre:#a0731f;
       --stone:#8f8470;--oxblood:#7a2a26;--sage:#4f7263;--mapink:#3b2f1f;--parch:#f3e6c6;--field:#e2c996;
       border-style:solid;border-color:transparent;border-width:92px 34px 72px 34px;
       border-image:url("/assets/images/gauss-game/scroll.webp") 205 75 160 75 fill stretch;
       padding:0 .8rem}
  @media (max-width:720px){.map{border-width:50px 18px 40px 18px;padding:0}}
  .map svg{display:block;width:100%;height:auto}
  .map .road{stroke:var(--road);stroke-width:10;stroke-linecap:round;fill:none}
  .map .road-hi{stroke:var(--road-hi);stroke-width:4;stroke-linecap:round;fill:none}
  .map .road.locked{stroke:#7d6647;stroke-width:3.5;stroke-dasharray:2 9}
  .map .node{cursor:pointer}
  .map .node.locked{cursor:default}
  .map .node circle.body{stroke-width:2.5;transition:r .15s}
  .map .node:not(.locked):hover circle.body{r:24}
  .map .node text{font-family:var(--serif);text-anchor:middle;pointer-events:none}
  .map .node.staged .num{font-size:14px}
  .map .node .num{font-size:17px;font-weight:700;dominant-baseline:central}
  .map .node .cap{font-size:13px;fill:var(--mapink);paint-order:stroke;stroke:var(--field);stroke-width:4px;stroke-linejoin:round}
  .map .node.locked .cap{fill:#8a7a5c}
  .map .sel-ring{fill:none;stroke:var(--mapink);stroke-width:1.5;stroke-dasharray:3 3}
  .map .token{fill:var(--oxblood);stroke:var(--parch);stroke-width:2}
  .shop{display:flex;flex-direction:column;gap:.6rem;margin-top:.4rem}
  .ware{display:flex;align-items:center;gap:1rem;padding:.55rem .7rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--ground)}
  .ware .d{flex:1 1 auto}
  .ware img{width:2.4rem;height:2.4rem;object-fit:contain}
  .worlds{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.6rem}
  .items button.item{display:flex;align-items:center;justify-content:center;gap:.45rem}
  .items button.item img{height:1.5rem;width:1.5rem;object-fit:contain}
  .items button.item:disabled img{opacity:.45}
  .ware .d b{color:var(--ink-strong)}
  .ware .d span{display:block;font-size:.88rem;color:var(--ink-mute)}
  .ware .own{font-size:.85rem;color:var(--ink-mute);white-space:nowrap}
  .cost{color:var(--gold);font-weight:600}

  .bt{display:flex;align-items:center;gap:1.2rem;padding:.7rem .9rem;margin-bottom:.9rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--field-bg)}
  .bt .who{flex:1 1 0;min-width:0}
  .bt .nm{font-size:1.02rem;font-weight:600;color:var(--ink-strong);display:flex;justify-content:space-between;gap:.5rem}
  .bt .nm span{font-weight:400;color:var(--ink-mute);font-size:.88rem}
  .bt .bar{position:relative;height:.8rem;border-radius:4px;overflow:visible;margin:.3rem 0 .15rem}
  .bt .bar .tr{position:absolute;inset:0;border-radius:4px;overflow:hidden}
  .bt .bar i{display:block;height:100%;transition:width .35s ease}
  .bt .you .tr{background:var(--hp-bg)} .bt .you i{background:var(--hp)}
  .bt .foe .tr{background:var(--foe-bg)} .bt .foe i{background:var(--foe)}
  .bt .hpv{font-size:.85rem;color:var(--ink-mute);font-variant-numeric:tabular-nums}
  .bt .vs{font-style:italic;color:var(--ink-faint)}
  .bt .pop{position:absolute;right:0;top:-1.25rem;font-weight:700;font-size:.95rem;animation:pop 1.1s ease-out forwards}
  .bt .you .pop{color:var(--hp)} .bt .foe .pop{color:var(--foe)}
  .bt .hit .tr{animation:shake .35s}
  @keyframes pop{0%{opacity:0;transform:translateY(.4rem)}20%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.5rem)}}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .btmsg{font-size:.92rem;color:var(--ink-mute);margin:-.4rem 0 .8rem;min-height:1.3rem}
  .items{display:flex;flex-direction:column;gap:.4rem}
  .items button .n{color:var(--ink-mute);margin-left:.3rem}
  .result.win .verdict{color:var(--s)}
  .result.lose .verdict{color:var(--hp)}
  .result .gain{font-size:.95rem;margin-top:.3rem;color:var(--ink)}
  .result .gain b{font-weight:600}
  button.dev{border-style:dashed;color:var(--ink-mute);font-size:.8rem}
  .modes button:disabled .fmla{font-style:italic}
  .col-main.waiting .board,.col-main.waiting #workPanel{opacity:.55;pointer-events:none;transition:opacity .2s}
  @media (max-width:720px){.bt{flex-direction:column;align-items:stretch;gap:.5rem}.bt .vs{display:none}.hud{gap:.8rem;font-size:.85rem}}

  /* ---- matrix ---- */
  .mtx{display:flex;justify-content:center;user-select:none}
  .rows{position:relative;display:inline-block}
  .brk{position:absolute;top:var(--caph);bottom:0;width:.55rem;border:2px solid var(--ink-strong);z-index:1;pointer-events:none}
  .brk.l{left:var(--labw);border-right:none}
  .brk.r{right:0;border-left:none}
  .caprow,.mrow{display:flex;align-items:stretch}
  .caprow{height:var(--caph)}
  .rlab{width:var(--labw);flex:none;display:flex;align-items:center;justify-content:flex-end;
        gap:.3rem;padding-right:.35rem;font-size:.92rem;color:var(--ink-mute);white-space:nowrap}
  .rlab.t{color:var(--t)} .rlab.s{color:var(--s)}
  .pad{width:.85rem;flex:none}
  .cells,.caps{display:grid;flex:1}
  .caps{font-size:.95rem;color:var(--ink-mute);align-items:end;font-family:var(--mono)}
  .caps div{text-align:center;padding-bottom:.25rem;transition:color .2s}
  .caps div.pv{color:var(--s);font-weight:600}
  .mrow{height:var(--rowh);cursor:pointer;position:relative;border-radius:3px}
  .mrow.static{cursor:default}
  .mrow:not(.static):hover{background:var(--ground-deep)}
  .mrow.t{background:var(--t-bg)}
  .mrow.s{background:var(--s-bg)}
  .cell{display:flex;flex-direction:column;align-items:center;justify-content:center;
        min-width:3rem;padding:0 .55rem;font-size:1.25rem;color:var(--ink-strong)}
  .cell.aug{border-left:1px solid var(--ink-faint)}
  .cell .old{font-size:.72rem;color:var(--ink-faint);text-decoration:line-through;line-height:1}
  .cell .new{color:var(--t)}
  .compact .mrow{height:2.2rem}
  .compact .cell{font-size:.98rem;min-width:2.2rem;padding:0 .4rem}
  .compact .rlab{font-size:.78rem}
  .handle{cursor:grab;color:var(--ink-faint);font-size:.8rem;line-height:1;padding:.15rem}
  .mrow:hover .handle{color:var(--accent)}

  /* drag */
  .mrow.lifted{opacity:.4;outline:2px dashed var(--ink-faint);outline-offset:-2px}
  .mrow.dropzone{background:var(--t-bg);outline:2px dashed var(--t);outline-offset:-2px}
  .mrow[data-drop]::after{content:attr(data-drop);position:absolute;left:100%;top:50%;
    transform:translateY(-50%);margin-left:.5rem;white-space:nowrap;
    font-family:var(--mono);font-size:.68rem;color:var(--t);background:var(--field-bg);
    border:1px solid var(--t);border-radius:4px;padding:.05rem .4rem}
  #ghost{position:fixed;pointer-events:none;z-index:50;background:var(--field-bg);
    border:1px solid var(--t);border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.22);
    padding:.2rem .55rem;display:none;align-items:center;gap:.55rem;font-size:1.05rem;color:var(--ink-strong)}
  #ghost .tag-r{font-size:.8rem;color:var(--t)}
  #ghost .g{display:flex;gap:.55rem}

  .vec{display:inline-flex;align-items:stretch;gap:.12rem;vertical-align:middle;margin:0 .12rem}

<script>
/* ============================== text ==============================
   Every player-facing string lives in row-reduce_text.json, keyed by where
   it appears. txt("a.b.c",{x:1}) looks one up and fills {x} placeholders;
   a missing key shows the key itself so gaps are easy to spot. A page can
   also preset window.ROW_REDUCE_TEXT (used for offline testing). */
var TEXT={};
function loadText(done){
  if(window.ROW_REDUCE_TEXT){TEXT=window.ROW_REDUCE_TEXT;done();return;}
  fetch("/widgets/row-reduce_text.json",{cache:"no-cache"})
    .then(function(r){return r.json();})
    .then(function(j){TEXT=j;done();})
    .catch(function(e){console.error("row-reduce: could not load text",e);done();});
}
function txt(path,vars){
  var keys=typeof path==="string"?path.split("."):path;
  var v=keys.reduce(function(o,k){return o==null?o:o[k];},TEXT);
  if(typeof v!=="string")return keys.join(".");
  return vars?v.replace(/\{(\w+)\}/g,function(m,k){return vars[k]!==undefined?vars[k]:m;}):v;
}
/* fill static labels, and copy names into the game tables that use them */
function applyText(){
  document.title=txt("menu.title");
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(el){el.textContent=txt(el.getAttribute("data-t"));});
  Object.keys(NODES).forEach(function(id){
    var nd=NODES[id];
    nd.name=txt(["places",id,"name"]);
    var foe=((TEXT.places||{})[id]||{}).foe;nd.foe=foe||null;
    var blurb=((TEXT.places||{})[id]||{}).blurb;nd.blurb=blurb||"";
  });
  SHOP.forEach(function(it){it.name=txt(["items",it.id,"name"]);it.desc=txt(["items",it.id,"desc"]);});
  [1,2,3].forEach(function(d){DIFFS[d].name=txt(["adventure","difficulties",String(d),"name"]);});
  ["swap","scale","add","addrow"].forEach(function(k){TOOL_NAME[k]=txt(["moveNames",k]);});
  [1,2].forEach(function(k){WORLDS[k]=txt(["worlds",String(k)]);});
}
function plural(n,one,many,vars){return txt(n===1?one:many,vars);}

/* ============================== exact rationals ============================== */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
function F(n,d){d=(d===undefined)?1:d;if(d===0)return{n:0,d:1};if(d<0){n=-n;d=-d;}var g=gcd(n,d);return{n:n/g,d:d/g};}
function add(x,y){return F(x.n*y.d+y.n*x.d,x.d*y.d);}
function mul(x,y){return F(x.n*y.n,x.d*y.d);}
function inv(x){return F(x.d,x.n);}
function dvd(x,y){return mul(x,inv(y));}
function neg(x){return{n:-x.n,d:x.d};}
function isZero(x){return x.n===0;}
function isOne(x){return x.n===1&&x.d===1;}
function eqF(x,y){return x.n===y.n&&x.d===y.d;}
function fstr(x){return x.d===1?String(x.n):x.n+"/"+x.d;}
function parseFrac(s){
  var t=String(s).replace(/\s+/g,""),m;
  if(t===""||t==="-"||t==="/")return null;
  if((m=/^(-?\d+)\/(-?\d+)$/.exec(t))){var d=+m[2];if(d===0)return null;return F(+m[1],d);}
  if((m=/^(-?\d+)$/.exec(t)))return F(+m[1]);
  if((m=/^(-?\d*\.\d+)$/.exec(t))){var dec=t.split(".")[1].length,p=Math.pow(10,dec);return F(Math.round(parseFloat(t)*p),p);}
  return null;
}
var SUB="\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089";
function sub(k){return String(k).split("").map(function(d){return SUB[+d];}).join("");}
/* ph: give nonnegative entries an invisible minus sign so that, in a column of
   centered entries, the digits of \u22122 and 3 line up instead of zigzagging. */
function fracHTML(v,cls,ph){
  var c=cls?' class="'+cls+'"':"";
  var sg=v.n<0?"\u2212":ph?'<span class="ph">\u2212</span>':"";
  if(v.d===1)return "<span"+c+">"+sg+Math.abs(v.n)+"</span>";
  return "<span"+c+'><span class="signed">'+sg+
    '<span class="frac"><span class="n">'+Math.abs(v.n)+'</span><span class="d">'+v.d+"</span></span></span></span>";
}

/* ============================== generation ============================== */
function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
/* incon: plant a 0 = c row before mixing, so the system has no solution */
function generateSystem(m,n,r,incon){
  r=Math.max(1,Math.min(r,Math.min(m,n)));
  for(var attempt=0;attempt<600;attempt++){
    var piv=[],pool=[];
    for(var k=0;k<n;k++)pool.push(k);
    for(var s=0;s<r;s++)piv.push(pool.splice(randInt(0,pool.length-1),1)[0]);
    piv.sort(function(a,b){return a-b;});
    var A=[];
    for(var i=0;i<m;i++){
      var row=[];for(var j=0;j<n;j++)row.push(0);
      if(i<r){
        row[piv[i]]=1;
        for(var j2=piv[i]+1;j2<n;j2++)if(piv.indexOf(j2)<0)row[j2]=randInt(-2,2);
      }
      A.push(row);
    }
    var x=[];for(var q=0;q<n;q++)x.push(randInt(-3,3));
    var M=A.map(function(row){
      var b=0;for(var k2=0;k2<n;k2++)b+=row[k2]*x[k2];
      return row.concat([b]);
    });
    if(incon&&r<m)M[r][n]=[-3,-2,-1,1,2,3][randInt(0,5)];
    var rounds=6+2*m;
    for(var t=0;t<rounds;t++){
      var u=Math.random();
      if(u<0.22&&m>1){
        var i1=randInt(0,m-1),j1=randInt(0,m-1);while(j1===i1)j1=randInt(0,m-1);
        var tmp=M[i1];M[i1]=M[j1];M[j1]=tmp;
      }else if(u<0.32){
        var i2=randInt(0,m-1);M[i2]=M[i2].map(function(v){return -v;});
      }else if(m>1){
        var i3=randInt(0,m-1),j3=randInt(0,m-1);while(j3===i3)j3=randInt(0,m-1);
        var c=[-2,-1,1,1,2][randInt(0,4)];
        var cand=M[i3].map(function(v,k3){return v+c*M[j3][k3];});
        if(Math.max.apply(null,cand.map(Math.abs))<=9)M[i3]=cand;
      }
    }
    var flat=[];M.forEach(function(row){row.forEach(function(v){flat.push(Math.abs(v));});});
    if(Math.max.apply(null,flat)>9)continue;
    if(M.some(function(row){return row.every(function(v){return v===0;});}))continue;
    var zeroCol=false;
    for(var k4=0;k4<n;k4++)if(M.every(function(row){return row[k4]===0;}))zeroCol=true;
    if(zeroCol)continue;
    return M.map(function(row){return row.map(function(v){return F(v);});});
  }
  var fb=[];
  for(var i5=0;i5<m;i5++){
    var row5=[];
    for(var j5=0;j5<n;j5++)row5.push(F(i5<r&&i5===j5?1:0));
    row5.push(F(i5<r?randInt(-3,3):0));
    fb.push(row5);
  }
  return fb;
}

/* ============================== row operations ============================== */
function applyOp(M,op){
  var N=M.map(function(r){return r.slice();});
  if(op.type==="swap"){var t=N[op.i];N[op.i]=N[op.j];N[op.j]=t;}
  else if(op.type==="scale"){N[op.i]=M[op.i].map(function(v){return mul(v,op.c);});}
  else if(op.type==="add"){N[op.i]=M[op.i].map(function(v,k){return add(v,mul(op.c,M[op.j][k]));});}
  return N;
}
function opLabel(op){
  if(op.type==="swap")return "R"+sub(op.i+1)+" \u2194 R"+sub(op.j+1);
  if(op.type==="scale")return "R"+sub(op.i+1)+" \u2190 "+(isOne(op.c)?"":fstr(op.c).replace("-","−")+" ")+"R"+sub(op.i+1);
  var sign=op.c.n<0?"\u2212":"+";
  var mag=fstr({n:Math.abs(op.c.n),d:op.c.d});
  return "R"+sub(op.i+1)+" \u2190 R"+sub(op.i+1)+" "+sign+" "+(mag==="1"?"":mag+" ")+"R"+sub(op.j+1);
}
function leadCol(row,n){for(var k=0;k<n;k++)if(!isZero(row[k]))return k;return -1;}

function analyze(M,n){
  var m=M.length,piv=M.map(function(r){return leadCol(r,n);});
  var rank=piv.filter(function(p){return p>=0;}).length;
  var inconsistent=false,badRow=-1;
  for(var i=0;i<m;i++)if(piv[i]===-1&&!isZero(M[i][n])){inconsistent=true;badRow=i;break;}
  var sorted=true,last=-1;
  for(var i2=0;i2<m;i2++){
    if(piv[i2]===-1){for(var j=i2;j<m;j++)if(piv[j]!==-1)sorted=false;break;}
    if(piv[i2]<=last)sorted=false;
    last=piv[i2];
  }
  var ref=sorted,rref=sorted;
  if(ref)for(var i3=0;i3<m;i3++){
    if(piv[i3]===-1)continue;
    if(!isOne(M[i3][piv[i3]]))rref=false;
    for(var j2=0;j2<m;j2++)if(j2!==i3&&!isZero(M[j2][piv[i3]]))rref=false;
  }
  return {piv:piv,rank:rank,inconsistent:inconsistent,badRow:badRow,ref:ref,rref:rref};
}

function generalSolution(M,n,info){
  if(info.inconsistent||!info.rref)return null;
  var pivCols=info.piv.filter(function(p){return p>=0;});
  var free=[];for(var k=0;k<n;k++)if(pivCols.indexOf(k)<0)free.push(k);
  var p=[];for(var q=0;q<n;q++)p.push(F(0));
  info.piv.forEach(function(pc,i){if(pc>=0)p[pc]=M[i][n];});
  var basis=free.map(function(f){
    var v=[];for(var q2=0;q2<n;q2++)v.push(F(0));
    v[f]=F(1);
    info.piv.forEach(function(pc,i){if(pc>=0)v[pc]=neg(M[i][f]);});
    return {col:f,v:v};
  });
  return {p:p,basis:basis,free:free};
}

/* ====================== reference solution and par ====================== */
/* Gauss-Jordan that avoids avoidable work: a pivot row whose entry is already 1
   is preferred so no scaling is needed, the row already in place is preferred so
   no swap is needed, and rows already zero in the pivot column are skipped. */
function refSolve(M0,n,T){
  if(T&&T.unit&&!T.add)return refSolveUnit(M0,n);
  var M=M0.map(function(r){return r.slice();}),ops=[],m=M.length,row=0;
  for(var col=0;col<n&&row<m;col++){
    var cand=[];
    for(var i=row;i<m;i++)if(!isZero(M[i][col]))cand.push(i);
    if(!cand.length)continue;
    var pick=-1;
    if(cand.indexOf(row)>=0&&isOne(M[row][col]))pick=row;
    if(pick<0)for(var t=0;t<cand.length;t++)if(isOne(M[cand[t]][col])){pick=cand[t];break;}
    if(pick<0)pick=(cand.indexOf(row)>=0)?row:cand[0];
    if(pick!==row){var o1={type:"swap",i:row,j:pick};M=applyOp(M,o1);ops.push(o1);}
    if(!isOne(M[row][col])){var o2={type:"scale",i:row,c:inv(M[row][col])};M=applyOp(M,o2);ops.push(o2);}
    for(var i2=0;i2<m;i2++){
      if(i2===row||isZero(M[i2][col]))continue;
      var o3={type:"add",i:i2,j:row,c:neg(M[i2][col])};M=applyOp(M,o3);ops.push(o3);
    }
    row++;
  }
  return {ops:ops,result:M};
}
/* The same elimination when adds are stuck at multiplier 1: to clear an
   entry a with the pivot row, first scale the pivot row so its pivot is -a,
   then add it. Clears that need the same scaling share it, and the pivot
   row is scaled back to a leading 1 at the end. */
function refSolveUnit(M0,n){
  var M=M0.map(function(r){return r.slice();}),ops=[],m=M.length,row=0;
  function go(o){M=applyOp(M,o);ops.push(o);}
  for(var col=0;col<n&&row<m;col++){
    var cand=[];
    for(var i=row;i<m;i++)if(!isZero(M[i][col]))cand.push(i);
    if(!cand.length)continue;
    var pick=cand.indexOf(row)>=0?row:cand[0];
    if(pick!==row)go({type:"swap",i:row,j:pick});
    var targets=[];
    for(var i2=0;i2<m;i2++)if(i2!==row&&!isZero(M[i2][col]))targets.push(i2);
    /* group rows by the entry to clear so each needed pivot value is set once */
    targets.sort(function(a,b){return fstr(M[a][col])<fstr(M[b][col])?-1:1;});
    targets.forEach(function(i3){
      var want=neg(M[i3][col]);
      if(!eqF(M[row][col],want))go({type:"scale",i:row,c:dvd(want,M[row][col])});
      go({type:"add",i:i3,j:row,c:F(1)});
    });
    if(!isOne(M[row][col]))go({type:"scale",i:row,c:inv(M[row][col])});
    row++;
  }
  return {ops:ops,result:M};
}

function rowKey(row){return row.map(fstr).join(",");}
function mtxKey(M){return M.map(rowKey).join(";");}

/* Restricted move set: swaps, normalizing a leading entry, and the elimination
   step that clears one entry using another row's pivot column. T limits it to
   the moves a player has (swap / scale / add a multiple / add a row); with
   adds stuck at 1, the useful scalings are the ones that make a row's entry
   the negative of another row's, so the next add clears it. */
function moves(M,n,T){
  T=T||FULL;
  var m=M.length,out=[],i,j,k,seen={};
  function push(o){var key=o.type+o.i+","+o.j+","+(o.c?fstr(o.c):"");if(!seen[key]){seen[key]=1;out.push(o);}}
  if(T.swap)for(i=0;i<m;i++)for(j=i+1;j<m;j++)if(rowKey(M[i])!==rowKey(M[j]))push({type:"swap",i:i,j:j});
  if(T.scale)for(i=0;i<m;i++){
    var p=leadCol(M[i],n);
    if(p>=0&&!isOne(M[i][p]))push({type:"scale",i:i,c:inv(M[i][p])});
  }
  if(T.add){
    for(j=0;j<m;j++){
      var pj=leadCol(M[j],n);
      if(pj<0)continue;
      for(i=0;i<m;i++){
        if(i===j||isZero(M[i][pj]))continue;
        push({type:"add",i:i,j:j,c:neg(dvd(M[i][pj],M[j][pj]))});
      }
    }
  }else if(T.unit){
    for(i=0;i<m;i++)for(j=0;j<m;j++){
      if(i===j)continue;
      push({type:"add",i:i,j:j,c:F(1)});
      if(T.scale)for(k=0;k<n;k++){
        if(isZero(M[i][k])||isZero(M[j][k]))continue;
        var c=neg(dvd(M[i][k],M[j][k]));
        if(!isOne(c))push({type:"scale",i:j,c:c});
      }
    }
  }
  return out;
}
var FULL={swap:true,scale:true,add:true,unit:true};

/* Iterative deepening under a node budget. Split the rows that differ from the
   target into those whose content appears nowhere in the target (each needs its
   own scale or add, since those rewrite one row) and those merely out of place
   (a swap fixes two at once), which bounds the remaining work from below. */
function shortestSolve(M,n,cap,T,budget){
  var Tg=refSolve(M,n).result,tk=Tg.map(rowKey),m=M.length;
  var tset={};tk.forEach(function(k){tset[k]=1;});
  function h(X){
    var w=0,q=0;
    for(var i=0;i<m;i++){
      var k=rowKey(X[i]);
      if(k===tk[i])continue;
      w++;if(!tset[k])q++;
    }
    return q+Math.ceil((w-q)/2);
  }
  var nodes=0,found=null;
  function dfs(X,depth,limit,path,seen){
    if(++nodes>budget)throw 0;
    var hh=h(X);
    if(hh===0){found=path.slice();return true;}
    if(depth+hh>limit)return false;
    var mv=moves(X,n,T);
    for(var q=0;q<mv.length;q++){
      var Y=applyOp(X,mv[q]),ky=mtxKey(Y);
      if(seen[ky])continue;
      if(depth+1+h(Y)>limit)continue;
      seen[ky]=1;path.push(mv[q]);
      if(dfs(Y,depth+1,limit,path,seen))return true;
      path.pop();delete seen[ky];
    }
    return false;
  }
  try{
    for(var lim=h(M);lim<cap;lim++){
      var seen={};seen[mtxKey(M)]=1;
      if(dfs(M,0,lim,[],seen))return {ops:found,proven:true};
    }
    return {ops:null,proven:true};
  }catch(e){return {ops:null,proven:false};}
}

/* T: the moves allowed (default: all). With adds stuck at 1 the reference
   route is longer and the search branches more, so it gets a bigger budget. */
function bestSolve(M,n,T,budget){
  var ref=refSolve(M,n,T),m=M.length,unit=T&&T.unit&&!T.add;
  if(m*n<=12&&ref.ops.length<=(unit?16:10)){
    var s=shortestSolve(M,n,ref.ops.length,T,budget||(unit?20000:8000));
    if(s.ops)return {ops:s.ops,proven:true};
    if(s.proven)return {ops:ref.ops,proven:true};
  }
  return {ops:ref.ops,proven:false};
}

/* ============================== state ============================== */
var S={screen:"menu",origin:"setup",m:3,n:3,r:3,orig:null,cur:null,hist:[],mode:"add",a:null,b:null,c:"1",
       drag:null,review:null,par:0,parProven:false,result:null,

function startFrom(M,T){
  S.orig=M;S.cur=M;S.hist=[];stepsSeen=-1;S.a=null;S.b=null;S.c="1";S.review=null;S.result=null;
  var bs=bestSolve(S.orig,S.n,T);
  S.par=bs.ops.length;S.parProven=bs.proven;
}
function newSystem(){
  S.r=Math.max(1,Math.min(S.r,Math.min(S.m,S.n)));

/* ---- custom entry: a grid of strings, resized without losing what was typed ---- */
function customCells(){
  var C=S.custom,old=C.cells||[],cells=[];
  for(var i=0;i<C.m;i++){
    var row=[];
    for(var k=0;k<=C.n;k++)row.push(old[i]&&old[i][k]!==undefined?old[i][k]:"");
    cells.push(row);
  }
  C.cells=cells;return cells;
}
function customMatrix(){
  var cells=customCells(),M=[],bad=false;
  for(var i=0;i<cells.length;i++){
    var row=[];
    for(var k=0;k<cells[i].length;k++){
      var t=cells[i][k].trim(),v=t===""?F(0):parseFrac(t);
      if(!v){bad=true;v=F(0);}
      row.push(v);
    }
    M.push(row);
  }
  return {M:M,bad:bad};
}
function currentC(){return parseFrac(S.c);}
function pendingOp(){
  var c=currentC();
  if(!c||isZero(c))return null;
  if(S.mode==="scale"&&S.a!==null)return isOne(c)?null:{type:"scale",i:S.a,c:c};
  if(S.mode==="add"&&S.a!==null&&S.b!==null)return {type:"add",i:S.b,j:S.a,c:c};
  return null;
}
function battleLocked(){return !!S.bt&&(S.bt.state!=="fight"||S.bt.turn==="enemy");}
function commit(op,free){
  if(battleLocked())return;
  S.hist.push({label:opLabel(op)+(free?" ✦":""),before:S.cur});
  S.cur=applyOp(S.cur,op);
  S.a=null;S.b=null;S.c="1";S.result=null;focusC=false;
  if(S.bt)battleAfterMove(!!free);
  render();
}
/* A column's caption turns green once it is a finished pivot column in its
   final place: a leading 1 sitting in the next row down (first pivot in row 1,
   second in row 2, ...) with zeros elsewhere in the column. A column whose
   only nonzeros sit in rows already claimed by earlier pivots is a free column
   and is skipped; scanning stops at the first column with unfinished work at
   or below the expected row, so a pivot in the wrong row does not light up
   anything to its right either. */
function pivotCols(M,n){
  var out={},r=0;
  for(var k=0;k<n;k++){
    var nz=[];
    for(var i=0;i<M.length;i++)if(!isZero(M[i][k]))nz.push(i);
    if(nz.every(function(i){return i<r;}))continue;   /* free column: only touches pivot rows above */
    if(nz.length===1&&nz[0]===r&&isOne(M[r][k])&&leadCol(M[r],n)===k){out[k]=true;r++;}
    else break;
  }
  return out;
}
function reviewMatrix(){
  var X=S.review.base;
  for(var i=0;i<S.review.idx;i++)X=applyOp(X,S.review.ops[i]);
  return X;
}

/* What Submit checks: the working matrix must be in reduced row echelon form.
   Row operations never change the solution set, so reaching RREF by legal
   moves is the whole game; the message says which condition still fails. */
function grade(){
  var n=S.n,M=S.cur,info=analyze(M,n);
  if(info.rref)return {ok:true,info:info};
  var why;
  if(!info.ref)why=txt("play.why.notEchelon");
  else{
    var notOne=false;
    for(var i=0;i<M.length;i++)if(info.piv[i]>=0&&!isOne(M[i][info.piv[i]]))notOne=true;
    why=notOne?txt("play.why.notOne"):txt("play.why.notCleared");
  }
  return {ok:false,why:why,info:info};
}

/* ============================== adventure ==============================
   A map of battles. Each enemy's HP is the fewest row operations still needed
   to reach RREF, so good moves wear it down and bad ones heal it. After every
   move that doesn't finish it, it strikes for a fixed amount, tuned so that a
   player at the level the fight expects survives exactly par + slack moves,
   where slack is 4, 2 or 0 by difficulty. Extra levels from side fights mean
   more HP than the fight was tuned for, which is real breathing room. */
var ADV_KEY="gauss-adventure-v3",A=null;
var DIFFS={1:{slack:4},2:{slack:2},3:{slack:0}};   /* names from the text file */
var TOOL_NAME={};
var WORLDS={};
/* Levels take more XP as you go, and stage XP grows more slowly than that,
   so a win moves you part of the way to the next level rather than exactly
   one level. Each stage's attack is tuned to the level a player would have
   from the main stages alone, so practice fights are what buy you slack. */
function maxHp(L){return 20+4*(L-1);}
function xpNeed(L){return 80+40*(L-1);}
function levelInfo(x){
  var L=1;
  while(x>=xpNeed(L)){x-=xpNeed(L);L++;}
  return {L:L,into:x,need:xpNeed(L)};
}
function stageXp(nd){return Math.round((40+15*nd.lvl)*(nd.kind==="boss"?1.5:1));}
function expectedLevel(lvl){
  var x=0;
  Object.keys(NODES).forEach(function(id){
    var nd=NODES[id];
    if((nd.kind==="main"||nd.kind==="boss")&&nd.lvl<lvl)x+=stageXp(nd);
  });
  return levelInfo(x).L;
}
function slack(){return DIFFS[A.diff].slack;}

function genPerm(m){
  var p;
  do{
    p=[];for(var i=0;i<m;i++)p.push(i);
    for(var j=m-1;j>0;j--){var r=randInt(0,j),t=p[j];p[j]=p[r];p[r]=t;}
  }while(p.every(function(v,i){return v===i;}));
  var b=[];for(var q=0;q<m;q++)b.push(randInt(-4,4));
  return p.map(function(r){
    var row=[];for(var k=0;k<m;k++)row.push(F(k===r?1:0));
    row.push(F(b[r]));return row;
  });
}
/* identity rows with a right-hand side, some rows scaled, sometimes shuffled */
function genScaled(m){
  var M=[],cs=[-3,-2,-1,2,3],hit=[],i;
  for(i=0;i<m;i++)hit.push(i);
  hit.sort(function(){return Math.random()-.5;});hit=hit.slice(0,m-1);
  for(i=0;i<m;i++){
    var c=hit.indexOf(i)>=0?cs[randInt(0,4)]:1,row=[];
    for(var k=0;k<m;k++)row.push(F(k===i?c:0));
    row.push(F(c*randInt(-3,3)));M.push(row);
  }
  if(Math.random()<.5){var a=randInt(0,m-1),b=(a+randInt(1,m-1))%m,t=M[a];M[a]=M[b];M[b]=t;}
  return M;
}
/* Training Yard: only the moves already learned, at a size you pick. Until
   rows can be combined it is a square shuffle (or scaled shuffle), so there
   is one size; after that, rows and columns separately, always full rank. */
function yardSquare(){return A.tools.indexOf("add")<0;}
function genYard(){
  var y=A.yard,t=A.tools;
  if(t.indexOf("scale")<0)return genPerm(y.m);
  if(yardSquare())return genScaled(y.m);
  return generateSystem(y.m,y.n,Math.min(y.m,y.n));
}
/* Sparring Ring: size and rank */
function genRing(){var g=A.ring;return generateSystem(g.m,g.n,Math.min(g.r,g.m,g.n));}

/* moves usable in the current battle: everything learned so far, plus the
   move this stage teaches (kept on a win), minus anything a curse takes */
function battleTools(){
  var nd=S.bt&&NODES[S.bt.node],t=A.tools.slice();
  if(nd&&nd.learn&&t.indexOf(nd.learn)<0)t.push(nd.learn);
  /* the Unit Hex: adding a multiple becomes adding a whole row only */
  if(nd&&nd.curse==="unit"&&t.indexOf("add")>=0)t=t.filter(function(x){return x!=="add";}).concat(["addrow"]);
  return t;
}
function toolFlags(t){
  function has(x){return t.indexOf(x)>=0;}
  return {swap:has("swap"),scale:has("scale"),add:has("add"),unit:has("add")||has("addrow")};
}
function battleFlags(){return toolFlags(battleTools());}
/* adds are stuck at multiplier 1 */
function unitAdd(){var f=S.bt&&battleFlags();return !!f&&f.unit&&!f.add;}
/* a camp or gate counts as cleared as soon as it is reachable */
function isCleared(id){return NODES[id].kind==="camp"?isOpen(id):A.cleared.indexOf(id)>=0;}
function isOpen(id){var r=NODES[id].req;return r===null||isCleared(r);}

function startBattle(id){
  var nd=NODES[id],M;
  do{M=nd.gen();}while(analyze(M,M[0].length-1).rref);
  S.bt={node:id};                         /* so battleTools knows the stage */
  var T=battleFlags();
  S.m=M.length;S.n=M[0].length-1;startFrom(M,T);
  /* Attack strength is fixed in advance from the HP a player would have on
     reaching this place by the main stages alone (tune: the stage it opens
     alongside). It never looks at the player's actual level, so extra XP
     from practice is pure breathing room and never makes enemies hit harder. */
  var K=S.par+slack()+(nd.bonus||0),tuned=maxHp(expectedLevel(nd.lvl||nd.tune));
  S.bt={node:id,T:T,K:K,dmg:tuned/(K-.5),max:maxHp(A.level),hp:maxHp(A.level),
        enemy:S.par,enemyMax:S.par,moves:0,state:"fight",turn:"you",hit:null,msg:""};
  var bt=battleTools();
  S.mode=nd.learn&&A.tools.indexOf(nd.learn)<0?nd.learn:(T.unit?"add":bt[bt.length-1]);
  if(S.mode==="addrow")S.mode="add";
  S.origin="map";S.screen="play";render();
}
function retryBattle(){
  var b=S.bt;clearTimeout(b.timer);b.turn="you";
  S.cur=S.orig;S.hist=[];S.a=null;S.b=null;S.c="1";stepsSeen=-1;
  b.hp=b.max;b.enemy=b.enemyMax;b.moves=0;b.state="fight";b.hit=null;b.msg="";b.reward=null;S.result=null;
  render();
}
function battleAfterMove(free){
  var b=S.bt,nd=NODES[b.node];
  if(!free)b.moves++;
  var info=analyze(S.cur,S.n),before=b.enemy;
  b.enemy=info.rref?0:bestSolve(S.cur,S.n,b.T,5000).ops.length;
  b.hit={foe:b.enemy-before,you:0};
  if(info.rref){winBattle();return;}
  if(free){b.msg=txt("battle.scrollUsed");return;}
  /* the enemy's turn: the board locks, it winds up, then strikes */
  var worse=b.enemy>before;
  b.turn="enemy";
  b.msg=(worse?txt("battle.grewStronger")+" ":"")+txt("battle.windsUp",{foe:nd.foe||nd.name});
  b.timer=setTimeout(function(){
    if(S.bt!==b||b.state!=="fight")return;
    b.hp-=b.dmg;b.hit={you:b.dmg,foe:0};b.turn="you";
    b.msg=txt("battle.strikes",{foe:nd.foe||nd.name});
    if(b.hp<=1e-9){b.hp=0;b.state="lost";b.msg="";}
    render();
  },ENEMY_DELAY);
}
var ENEMY_DELAY=900;
function winBattle(){
  var b=S.bt,nd=NODES[b.node];
  b.state="won";b.enemy=0;
  var spare=Math.max(0,b.K-b.moves);
  /* practice pays little; the side quest pays well */
  var r=nd.kind==="side"?{gold:2,xp:10}:nd.kind==="quest"?{gold:25+3*spare,xp:80}
       :{gold:6+4*nd.lvl+3*spare,xp:stageXp(nd)};
  /* efficiency bonus, the same on every difficulty: finishing within two
     moves of par earns extra XP, and each move under par earns more */
  r.bonus=nd.kind==="side"?Math.max(0,b.enemyMax+2-b.moves)
         :8*Math.max(0,b.enemyMax+2-b.moves);
  r.xp+=r.bonus;
  r.learn=null;
  var L0=A.level;
  A.gold+=r.gold;A.xp+=r.xp;A.level=levelInfo(A.xp).L;r.levelUp=A.level>L0;
  if(nd.kind!=="side"&&A.cleared.indexOf(b.node)<0){
    A.cleared.push(b.node);
    if(nd.learn&&A.tools.indexOf(nd.learn)<0){A.tools.push(nd.learn);r.learn=nd.learn;}
  }
  if(b.node==="1.6"){r.world=true;A.world=2;A.at="2.0";}
  b.reward=r;
  if(nd.world===2){S.result=grade();S.tvals={};S.solnView="eq";}
  var info=analyze(S.cur,S.n);
  b.msg=info.inconsistent?txt("battle.noSolution",{c:fstr(S.cur[info.badRow][S.n])}):txt("battle.reduced");
  saveAdv();
}
function useItem(id){
  var b=S.bt;

  if(id==="potion"){
    if(b.hp>=b.max)return;
    var before=b.hp;b.hp=Math.min(b.max,b.hp+b.max/2);
    A.items.potion--;b.hit={you:-(b.hp-before),foe:0};
    b.msg=txt("battle.potionUsed");
    saveAdv();render();
  }else{
    var op=bestSolve(S.cur,S.n,b.T,5000).ops[0];
    A.items.scroll--;saveAdv();
    commit(op,true);
  }
}

function renderPlay(){
  var n=S.n,inReview=!!S.review;
  var shown=inReview?reviewMatrix():S.cur;

  var roles={},prev=null;
  if(inReview){
    var rop=S.review.ops[S.review.idx];
    if(rop){
      prev=applyOp(shown,rop);
      if(rop.type==="swap"){roles[rop.i]="t";roles[rop.j]="s";}
      else{roles[rop.i]="t";if(rop.type==="add")roles[rop.j]="s";}
    }
  }else{
    if(S.mode==="add"){if(S.a!==null)roles[S.a]="s";if(S.b!==null)roles[S.b]="t";}
    else if(S.a!==null)roles[S.a]="t";
    var pop=pendingOp();
    if(pop)prev=applyOp(S.cur,pop);
  }

  var used=S.hist.length;
  document.getElementById("readout").innerHTML=
    '<div><span class="k">'+used+'</span><span class="w-label">'+txt("common.moves")+'</span></div>'+
    '<div><span class="k">'+S.par+'</span><span class="w-label">'+parWord()+'</span></div>';

  var strip=document.getElementById("steps");
  strip.innerHTML=stepsHTML();
  /* follow the newest move, but leave the scroll alone on other re-renders */
  if(S.hist.length!==stepsSeen){stepsSeen=S.hist.length;strip.scrollLeft=strip.scrollWidth;}
  document.getElementById("workMtx").innerHTML=matrixHTML(shown,n,{roles:roles,preview:prev,live:!inReview,pivots:pivotCols(shown,n)});

  document.getElementById("battle").innerHTML=S.bt?battleHTML():"";

  var panel="";
  /* during the enemy's turn keep the controls on screen, just inert */
  document.querySelector("#scrPlay .col-main").classList.toggle("waiting",!!S.bt&&S.bt.turn==="enemy");
  if(!inReview&&!(S.bt&&S.bt.state!=="fight")){
    var modes=[["swap",txt("play.modes.swap"),txt("play.modes.swapFormula")],
               ["scale",txt("play.modes.scale"),txt("play.modes.scaleFormula")],
               ["add",txt("play.modes.add"),txt("play.modes.addFormula")]];
    panel+='<div class="modes">'+modes.map(function(x){
      var f=S.bt&&battleFlags(),locked=!!f&&!(x[0]==="add"?f.unit:f[x[0]]);
      if(x[0]==="add"&&unitAdd())x=["add",txt("play.modes.addRow"),txt("play.modes.addRowFormula")];
      return '<button aria-pressed="'+(S.mode===x[0])+'" data-mode="'+x[0]+'"'+(locked?" disabled":"")+'>'+
             x[1]+'<span class="fmla">'+(locked?txt("play.modes.locked"):x[2])+"</span></button>";
    }).join("")+"</div>";
    var prompt;
    if(S.mode==="swap")
      prompt=S.a===null?txt("play.prompts.swapStart"):txt("play.prompts.swapPicked",{row:"R"+sub(S.a+1)});
    else if(S.mode==="scale")
      prompt=S.a===null?txt("play.prompts.scaleStart"):txt("play.prompts.setMultiplier");
    else if(unitAdd())
      prompt=S.a===null?txt("play.prompts.addRowStart"):txt("play.prompts.addRowPicked",{row:"R"+sub(S.a+1)});
    else
      prompt=S.a===null?txt("play.prompts.addStart")
           :S.b===null?txt("play.prompts.addPicked",{row:"R"+sub(S.a+1)})
           :txt("play.prompts.setMultiplier");
    panel+='<div class="prompt">'+prompt+"</div>";
    var showPanel=(S.mode==="scale"&&S.a!==null)||(S.mode==="add"&&S.a!==null&&S.b!==null);
    if(showPanel){
      var c=currentC(),bad=!c||isZero(c),op2=pendingOp();
      var lhs=S.mode==="scale"?"R"+sub(S.a+1)+" ← ":"R"+sub(S.b+1)+" ← R"+sub(S.b+1)+" + ";
      panel+='<div class="opline"><span>'+lhs+"</span>"+
        '<input id="cin" value="'+S.c.replace(/"/g,"&quot;")+'" class="'+(bad?"bad":"")+'" aria-label="'+txt("play.multiplier")+'">'+
        "<span>R"+sub(S.a+1)+"</span>"+
        '<button class="sm" id="apply"'+(op2?"":" disabled")+">"+txt("play.apply")+"</button>"+
        '<button class="quiet sm" id="cancel">'+txt("play.cancel")+'</button></div>';
      var quick=[];
      if(S.mode==="scale"){
        quick.push(["−1","-1"],["1/2","1/2"],["2","2"]);
      }else{
        quick.push(["−1","-1"],["1","1"],["−2","-2"]);
      }
      panel+='<div class="quick">'+quick.map(function(q){
        return '<button data-quick="'+q[1]+'">'+q[0]+"</button>";
      }).join("")+"</div>";
      if(bad)panel+='<div class="err">'+txt("play.badMultiplier")+"</div>";
    }
  }
  document.getElementById("workPanel").innerHTML=panel;

  var side="",acts="";
  if(S.bt){
    var bs=battleSide();
    document.getElementById("sideHead").textContent=bs.head;
    side=bs.side;acts=bs.acts;
  }else if(inReview){
    var rv=S.review,cur=rv.ops[rv.idx];
    document.getElementById("sideHead").textContent=txt("play.review.title");
    side='<div class="review"><div class="now">'+(cur?txt("play.review.next",{op:opLabel(cur)}):txt("play.review.done"))+"</div>"+
      '<div class="nav">'+
      '<button class="sm" id="rvPrev"'+(rv.idx===0?" disabled":"")+">"+txt("play.review.prev")+"</button>"+
      '<button class="sm" id="rvNext"'+(cur?"":" disabled")+">"+txt("play.review.nextButton")+"</button>"+
      '<button class="quiet sm" id="rvAll"'+(cur?"":" disabled")+'>'+txt("play.review.runToEnd")+'</button></div>'+
      '<ol class="log">'+rv.ops.map(function(o,k){
        return '<li class="'+(k<rv.idx?"done":k===rv.idx?"cur":"")+'">'+opLabel(o)+"</li>";
      }).join("")+"</ol></div>";
    acts='<button id="rvExit">'+txt("play.review.backToWork")+'</button>';
  }else if(S.result){
    document.getElementById("sideHead").textContent=txt("play.result");
    side=resultHTML();
    acts='<div class="row"><button class="sm" id="resClose">'+txt("play.close")+'</button>'+
         '<button class="sm" id="resNew">'+txt("play.newMatrix")+'</button></div>';
  }else{
    document.getElementById("sideHead").textContent="";
    acts='<div class="row"><button class="sm" id="undo"'+(S.hist.length?"":" disabled")+'>'+txt("play.undo")+'</button>'+
         '<button class="sm" id="reset"'+(S.hist.length?"":" disabled")+'>'+txt("play.restart")+'</button></div>'+
         '<button class="primary" id="submit">'+txt("play.submit")+'</button>'+
         '<button class="warn sm" id="solve">'+txt("play.showSolution")+'</button>';
  }
  document.getElementById("log").innerHTML=side;
  document.getElementById("sideActions").innerHTML=acts;

  var inp=document.getElementById("cin");
  if(inp&&focusC){inp.focus();inp.setSelectionRange(caret,caret);}
}

function resultHTML(){
  var R=S.result,n=S.n,h='<div class="result">';
  if(!R.ok){
    return h+'<div class="verdict">'+txt("play.notYet")+'</div><div class="why">'+R.why+"</div></div>";
  }
  var used=S.hist.length,d=used-S.par;
  var line=d<0?txt("play.underPar",{d:-d}):d===0?txt("play.atPar"):txt("play.overPar",{d:d});
  h+='<div class="verdict">'+txt("play.solved")+'</div>'+
     '<div class="score">'+plural(used,"play.scoreOne","play.scoreMany",{moves:used,vsPar:line})+"</div>";
  var info=R.info,dof=n-info.rank;
  h+='<div class="free">'+(info.inconsistent?txt("play.noSolution"):dof===0?txt("play.uniqueSolution"):txt("play.infiniteSolutions"))+
     '</div><div class="free"><a href="#solnSec" class="jump">'+txt("play.seeSolution")+"</a></div>";
  return h+"</div>";
}

/* ---- the solution section under the starting matrix ---- */
var FREE_COLORS=["#b5651d","#6a4c93","#1f7a8c","#c1440e","#2e6cb5","#4b7d3c"];
function xname(k){return "x"+sub(k+1);}
function freeSpan(idx,text){return '<span class="fv" style="color:'+FREE_COLORS[idx%FREE_COLORS.length]+'">'+text+"</span>";}
function termHTML(c,label,first){
  /* one "+ c label" term with the sign pulled out front */
  var negv=c.n<0,mag={n:Math.abs(c.n),d:c.d},sign=negv?"\u2212":"+";
  var coef=isOne(mag)?"":fracHTML(mag)+"\u202F";
  if(first)return (negv?"\u2212":"")+coef+label;
  return " "+sign+" "+coef+label;
}
function solutionHTML(){
  var R=S.result,n=S.n,info=R.info;
  if(info.inconsistent){
    return '<div class="soln-body">'+txt("solution.inconsistent",{row:info.badRow+1,c:fstr(S.cur[info.badRow][n])})+"</div>";
  }
  var gs=generalSolution(S.cur,n,info),free=gs.free,h="";
  if(free.length){
    h+='<div class="soln-tabs">'+
       '<button class="sm" data-sview="eq" aria-pressed="'+(S.solnView==="eq")+'">'+txt("solution.equationForm")+"</button>"+
       '<button class="sm" data-sview="vec" aria-pressed="'+(S.solnView==="vec")+'">'+txt("solution.vectorForm")+"</button></div>";
  }
  if(S.solnView==="eq"||!free.length){
    /* each pivot variable in terms of the free ones; free ones are themselves */
    var lines=[];
    for(var k=0;k<n;k++){
      var fi=free.indexOf(k);
      if(fi>=0){lines.push(xname(k)+" = "+freeSpan(fi,xname(k))+ ' <span class="tag-free">'+txt("solution.free")+"</span>");continue;}
      var rhs=isZero(gs.p[k])&&free.some(function(f,idx){return !isZero(gs.basis[idx].v[k]);})?"":fracHTML(gs.p[k]);
      var first=rhs==="";
      free.forEach(function(f,idx){
        var c=gs.basis[idx].v[k];if(isZero(c))return;
        rhs+=termHTML(c,freeSpan(idx,xname(f)),first);first=false;
      });
      lines.push(xname(k)+" = "+rhs);
    }
    h+='<div class="soln-body eqs">'+lines.map(function(l){return "<div>"+l+"</div>";}).join("")+"</div>";
  }else{
    var body="x = "+vecHTML(gs.p);
    gs.basis.forEach(function(bs,idx){body+=" + "+xname(free[idx])+"\u202F"+vecHTML(bs.v);});
    h+='<div class="soln-body">'+body+"</div>";
  }
  if(free.length){
    h+='<div class="soln-part"><div class="soln-sub">'+txt("solution.pickValues")+"</div>"+
       '<div class="tsliders">'+free.map(function(f,idx){
         var v=S.tvals[f]||0;
         return '<label class="tslider">'+freeSpan(idx,xname(f))+' = <span class="tv" id="tv'+f+'">'+v+'</span>'+
                '<input type="range" min="-5" max="5" step="1" value="'+v+'" data-tv="'+f+'"></label>';
       }).join("")+"</div>"+
       '<div class="soln-body" id="partSol">'+particularHTML(gs)+"</div></div>";
  }
  return h;
}
function particularHTML(gs){
  var n=S.n,x=gs.p.slice();
  gs.basis.forEach(function(bs){
    var t=F(S.tvals[bs.col]||0);
    x=x.map(function(v,k){return add(v,mul(t,bs.v[k]));});
  });
  return "<span>x = "+vecHTML(x)+'</span><span class="soln-sub">'+
    x.map(function(v,k){return xname(k)+" = "+fracHTML(v);}).join(", ")+"</span>";
}
function renderSolution(){
  var sec=document.getElementById("solnSec");
  var show=S.screen==="play"&&S.result&&S.result.ok;
  sec.hidden=!show;
  sec.innerHTML=show?'<h2 class="h">'+txt("solution.title")+"</h2>"+solutionHTML():"";
}

function render(){
  ["Menu","Setup","Custom","Play","Adv","Map"].forEach(function(k){
    document.getElementById("scr"+k).classList.toggle("on",S.screen===k.toLowerCase());
  });
  if(S.screen==="adv")renderAdvStart();
  else if(S.screen==="map")renderMap();
  else if(S.screen==="setup")renderSetup();
  else if(S.screen==="custom")renderCustom();
  else if(S.screen==="play")renderPlay();
  renderSolution();
}

/* ============================== interaction ============================== */
function rowClick(i){
  if(S.review||battleLocked())return;
  S.result=null;
  var n=S.n,cur=S.cur;
  if(S.mode==="swap"){
    if(S.a===null)S.a=i;
    else if(S.a===i)S.a=null;
    else{commit({type:"swap",i:S.a,j:i});return;}
  }else if(S.mode==="scale"){
    if(S.a===i)S.a=null;
    else{
      S.a=i;S.c="1";
    }
  }else{
    if(S.a===null)S.a=i;
    else if(S.a===i){S.a=null;S.b=null;}
    else if(unitAdd()){commit({type:"add",i:i,j:S.a,c:F(1)});return;}
    else{
      S.b=i;S.c="1";
    }
  }
  focusC=false;render();
}

document.addEventListener("click",function(e){
  var t=e.target,el;
  /* setup */
  if((el=t.closest("[data-step]"))){
    var id=el.getAttribute("data-step"),dir=+el.getAttribute("data-dir");
    if(id==="m")S.m=Math.max(2,Math.min(6,S.m+dir));
    if(id==="n")S.n=Math.max(2,Math.min(6,S.n+dir));
    if(id==="r")S.r=Math.max(1,Math.min(Math.min(S.m,S.n),S.r+dir));
    if(id==="cm"){S.custom.m=Math.max(2,Math.min(6,S.custom.m+dir));render();return;}
    if(id==="ym"||id==="yn"){
      var y=A.yard;y[id[1]]=Math.max(2,Math.min(4,y[id[1]]+dir));
      if(yardSquare())y.n=y.m;
      saveAdv();render();return;
    }
    if(id==="gm"||id==="gn"||id==="gr"){
      var g=A.ring,k=id[1];g[k]=Math.max(k==="r"?1:2,Math.min(5,g[k]+dir));
      g.r=Math.min(g.r,g.m,g.n);saveAdv();render();return;
    }
    if(id==="cn"){S.custom.n=Math.max(2,Math.min(6,S.custom.n+dir));render();return;}
    newSystem();return;
  }
  if(t.closest("#newsys")){newSystem();return;}
  if(t.closest("#play")){S.origin="setup";S.screen="play";S.result=null;render();return;}
  /* adventure */
  if(t.closest("#toAdv")){S.screen="adv";render();return;}
  if(t.closest("#toMenu3")||t.closest("#mapMenu")){S.screen="menu";render();return;}
  if((el=t.closest("[data-diff]"))){newAdv(+el.getAttribute("data-diff"));S.screen="map";render();return;}
  if(t.closest("#advCont")){S.screen="map";render();return;}
  if((el=t.closest("[data-world]"))){
    var wk=+el.getAttribute("data-world");
    if(isOpen(wk+".0")){A.world=wk;A.sheet=null;saveAdv();render();}
    return;
  }
  if((el=t.closest("[data-node]"))){
    var id=el.getAttribute("data-node"),nd=NODES[id];
    if(!isOpen(id))return;
    A.at=id;A.sheet=null;saveAdv();
    if((nd.kind==="main"||nd.kind==="boss"||nd.kind==="quest")&&!isCleared(id)){startBattle(id);return;}
    if(nd.kind==="shop"||nd.kind==="side")A.sheet=id;
    render();return;
  }
  if(t.closest("#fight")){var sh=A.sheet;A.sheet=null;startBattle(sh);return;}
  if(t.closest("#sheetClose")||(S.screen==="map"&&A.sheet&&t.closest("#map"))){A.sheet=null;render();return;}
  if((el=t.closest("[data-buy]"))){
    var w=SHOP.filter(function(x){return x.id===el.getAttribute("data-buy");})[0];
    if(A.gold>=w.cost){A.gold-=w.cost;A.items[w.id]++;saveAdv();render();}
    return;
  }
  if(t.closest("#btPotion")){useItem("potion");return;}
  if(t.closest("#btScroll")){useItem("scroll");return;}
  if(t.closest("#btRetry")){retryBattle();return;}
  if(t.closest("#btRetreat")||t.closest("#btMap")){leaveBattle();return;}
  if(t.closest("#btSkip")){
    if(S.bt&&S.bt.state==="fight"){
      clearTimeout(S.bt.timer);S.bt.turn="you";
      S.hist.push({label:txt("battle.skippedDev"),before:S.cur});
      S.cur=refSolve(S.cur,S.n).result;winBattle();render();
    }
    return;
  }
  if(t.closest("#toSetup")&&S.bt){leaveBattle();return;}
  if(t.closest("#toSetup")){S.screen=S.origin;S.review=null;S.result=null;S.a=null;S.b=null;render();return;}
  /* menu */
  if(t.closest("#toSetupNew")){S.screen="setup";render();return;}
  if(t.closest("#toCustom")){S.screen="custom";render();return;}
  if(t.closest("#toMenu")||t.closest("#toMenu2")){S.screen="menu";render();return;}
  /* custom */
  if(t.closest("#cclear")){S.custom.cells=null;render();return;}
  if(t.closest("#cplay")){
    var cm=customMatrix();if(cm.bad)return;
    S.m=S.custom.m;S.n=S.custom.n;S.origin="custom";
    startFrom(cm.M);S.screen="play";render();return;
  }
  /* result */
  if(t.closest("#resClose")){S.result=null;render();return;}
  if(t.closest("#resNew")){
    S.result=null;S.review=null;
    if(S.origin==="custom"){S.custom.cells=null;S.screen="custom";render();}
    else{S.screen="setup";newSystem();}
    return;
  }
  /* play */
  if(t.closest("#submit")){S.result=grade();S.tvals={};S.a=null;S.b=null;render();return;}
  if((el=t.closest("[data-sview]"))){S.solnView=el.getAttribute("data-sview");render();return;}
  if(t.closest("#solve")){
    var bs=bestSolve(S.cur,S.n);
    S.review={base:S.cur,ops:bs.ops,idx:0};
    S.a=null;S.b=null;S.result=null;render();return;
  }
  if(t.closest("#rvNext")){if(S.review&&S.review.idx<S.review.ops.length)S.review.idx++;render();return;}
  if(t.closest("#rvPrev")){if(S.review&&S.review.idx>0)S.review.idx--;render();return;}
  if(t.closest("#rvAll")){if(S.review)S.review.idx=S.review.ops.length;render();return;}
  if(t.closest("#rvExit")){S.review=null;render();return;}
  if((el=t.closest("[data-mode]"))){S.mode=el.getAttribute("data-mode");S.a=null;S.b=null;S.c="1";focusC=false;render();return;}
  if((el=t.closest("[data-quick]"))){S.c=el.getAttribute("data-quick");focusC=false;render();return;}
  if(t.closest("#apply")){var op=pendingOp();if(op)commit(op);return;}
  if(t.closest("#cancel")){S.a=null;S.b=null;S.c="1";focusC=false;render();return;}
  if(t.closest("#undo")){if(S.hist.length){S.cur=S.hist.pop().before;S.a=null;S.b=null;S.result=null;render();}return;}
  if(t.closest("#reset")){S.cur=S.orig;S.hist=[];S.a=null;S.b=null;S.result=null;render();return;}
  var row=t.closest("#workMtx .mrow");
  if(row)rowClick(+row.getAttribute("data-row"));
});

document.addEventListener("input",function(e){
  if(e.target.id==="cin"){S.c=e.target.value;focusC=true;caret=e.target.selectionStart;render();}
  var tv=e.target.getAttribute&&e.target.getAttribute("data-tv");
  if(tv!==null&&tv!==undefined&&S.result&&S.result.ok){
    /* only the particular solution changes, so don't rebuild the sliders mid-drag */
    S.tvals[+tv]=+e.target.value;
    document.getElementById("tv"+tv).textContent=e.target.value;
    document.getElementById("partSol").innerHTML=particularHTML(generalSolution(S.cur,S.n,S.result.info));
    return;
  }
  var ci=e.target.getAttribute&&e.target.getAttribute("data-ci");
  if(ci!==null&&ci!==undefined){
    /* keep the typed cell in place: update state and only re-validate the
       field that changed, so focus and caret survive */
    var ck=+e.target.getAttribute("data-ck");
    customCells()[+ci][ck]=e.target.value;
    e.target.classList.toggle("bad",e.target.value.trim()!==""&&!parseFrac(e.target.value));
    var anyBad=!!document.querySelector("#entry input.bad");
    document.getElementById("cnote").textContent=anyBad?txt("custom.badEntries"):"";
    document.getElementById("cplay").disabled=anyBad;
  }
});
document.addEventListener("keydown",function(e){
  if(S.screen==="custom"&&e.key==="Enter"&&e.target.getAttribute("data-ci")!==null){
    /* Enter moves to the next entry; from the last one it starts the game */
    var all=Array.prototype.slice.call(document.querySelectorAll("#entry input")),k=all.indexOf(e.target);
    if(k>=0&&k<all.length-1)all[k+1].focus();else document.getElementById("cplay").click();
    return;
  }
  if(S.screen!=="play")return;
  if(S.result&&!S.bt&&e.key==="Escape"){S.result=null;render();return;}
  if(S.review){
    if(e.key==="ArrowRight"&&S.review.idx<S.review.ops.length){S.review.idx++;render();}
    if(e.key==="ArrowLeft"&&S.review.idx>0){S.review.idx--;render();}
    if(e.key==="Escape"){S.review=null;render();}
    return;
  }
  if(e.key==="Escape"){S.a=null;S.b=null;focusC=false;render();}
  if(e.key==="Enter"){var op=pendingOp();if(op)commit(op);}
});

/* ── dragging a row by its handle ─────────────────────────────────────────── */
function workRows(){return document.querySelectorAll("#workMtx .mrow");}
function clearDragMarks(){
  workRows().forEach(function(el){
    el.classList.remove("lifted","dropzone");
    el.removeAttribute("data-drop");
  });
}
function markDrag(){
  clearDragMarks();
  var rows=workRows(),d=S.drag;
  if(!rows[d.from])return;
  rows[d.from].classList.add("lifted");
  if(d.over!==null&&d.over!==d.from&&rows[d.over]){
    rows[d.over].classList.add("dropzone");
    rows[d.over].setAttribute("data-drop",txt("play.dropHere",{row:"R"+sub(d.from+1)}));
    rows[d.from].setAttribute("data-drop",txt("play.dropHere",{row:"R"+sub(d.over+1)}));
  }
}
function showGhost(i,x,y){
  var g=document.getElementById("ghost");
  var cells=S.cur[i].map(function(v,k){
    return "<span"+(k===S.n?' style="border-left:1px solid var(--line);padding-left:.5rem"':"")+">"+fracHTML(v,"",true)+"</span>";
  }).join("");
  g.innerHTML='<span class="tag-r">R'+sub(i+1)+'</span><span class="g">'+cells+"</span>";
  g.style.display="flex";
  moveGhost(x,y);
}
function moveGhost(x,y){
  var g=document.getElementById("ghost");
  g.style.left=(x+16)+"px";
  g.style.top=(y-14)+"px";
}
document.addEventListener("mousedown",function(e){
  var h=e.target.closest("[data-handle]");
  if(!h||S.review||battleLocked())return;
  e.preventDefault();
  var from=+h.getAttribute("data-handle");
  S.drag={from:from,over:from};
  markDrag();
  showGhost(from,e.clientX,e.clientY);
});
document.addEventListener("mousemove",function(e){
  if(!S.drag)return;
  moveGhost(e.clientX,e.clientY);
  var row=e.target.closest("#workMtx .mrow");
  var i=row?+row.getAttribute("data-row"):null;
  if(i!==S.drag.over){S.drag.over=i;markDrag();}
});
document.addEventListener("mouseup",function(){
  if(!S.drag)return;
  var d=S.drag;S.drag=null;
  document.getElementById("ghost").style.display="none";
  clearDragMarks();
  if(d.over!==null&&d.over!==d.from)commit({type:"swap",i:d.from,j:d.over});
});

loadText(function(){
applyText();
newSystem();
});

/* ============================== embed height ==============================
   The screens differ a lot in height, so report the content height to the
   host widget layout and let it resize the iframe instead of leaving a fixed
   frame with dead space or a scrollbar. */
(function(){
  if(window.parent===window)return;
  var el=document.getElementById("plate");
  function post(){
    var h=Math.ceil(el.getBoundingClientRect().height);
    try{parent.postMessage({embedHeight:h},"*");}catch(e){}
  }
  if(window.ResizeObserver)new ResizeObserver(post).observe(el);
  addEventListener("load",post);setTimeout(post,60);post();
})();
</script>
